#  Libris CI/CD Automation Pipeline
# Purpose: High-speed automated verification for every push or PR.

name: Libris Engineering Excellence

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  #   Database / Migration CI 
  database-ci:
    name: Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Apply Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Applying CI Stubs..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/ci_stubs.sql"
          for sql in $(ls backend/scripts/[0-9][0-9]_*.sql | sort); do
            echo "Applying $sql..."
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$sql"
          done

      - name: Validate Hardening Scripts (Forward & Rollback)
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Setting up Supabase Roles for Hardening Testing..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF;
            END \$\$;
          "
          echo "Testing 01_DRAFT Forward & Rollback..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/01_DRAFT_revoke_dangerous_privileges.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/01_DRAFT_revoke_dangerous_privileges_rollback.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/01_DRAFT_revoke_dangerous_privileges.sql"

          echo "Testing 02_DRAFT User Profiles Forward Reconcile Migration..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/02_DRAFT_reconcile_user_profiles.sql"

          echo "Testing 02_DRAFT User Profiles Rollback Runtime 10 Scenarios..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_02_user_profiles_rollback_runtime.sql"

          echo "Testing 03_DRAFT Model A Interactions & Trigger Forward Migration..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger.sql"

          echo "Testing 03_DRAFT Model A Runtime Verification (8 Scenarios)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_03_interactions_and_trigger_runtime.sql"

          echo "Testing 03_DRAFT Model A Rollback & Re-Forward..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger_rollback.sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/03_DRAFT_reconcile_interactions_and_trigger.sql"

          echo "Testing 04_DRAFT Catalog Lifecycle (Baseline -> Forward -> Verify -> DepCheck -> Rollback -> VerifyBaseline -> Forward -> Re-Verify)..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/scripts/hardening/test_04_vector_rpc_catalog_lifecycle.sql"

  #   Backend CI (Python/Flask) 
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    needs: database-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Static Analysis (Ruff)
        run: |
          ruff check backend/
        continue-on-error: false

      - name: Execute Pytest Suite
        run: |
          PYTHONPATH=backend python -m pytest backend/tests/ -v --tb=short

  #   Docker Build CI 
  docker-ci:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: |
          docker build --no-cache -t libris-backend backend/

  #   Frontend CI (Flutter/Dart) 
  frontend-ci:
    name: Mobile App Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: true

      - name: Fetch Pub Dependencies
        run: |
          cd mobile/flutter_app
          flutter pub get

      - name: Structural Analysis
        run: |
          cd mobile/flutter_app
          flutter analyze --no-fatal-infos

      - name: Unit & Widget Tests
        run: |
          cd mobile/flutter_app
          flutter test

  # Backend Integration CI
  backend-integration-ci:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Applying CI Stubs..."
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "backend/ci_stubs.sql"
          for sql in $(ls backend/scripts/[0-9][0-9]_*.sql | sort); do
            echo "Applying $sql..."
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$sql"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Execute Integration Tests
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: |
          PYTHONPATH=backend python -m pytest backend/tests/ -m "integration" -v --tb=short

  #   Frontend CI (Next.js/Web)
  web-ci:
    name: Web App Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          cd web
          npm ci

      - name: Lint
        run: |
          cd web
          npm run lint

      - name: Test
        run: |
          cd web
          npm test

      - name: Build
        run: |
          cd web
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          LIBRIS_API_KEY: "mock_api_key"
          BACKEND_URL: "http://localhost:5000"
