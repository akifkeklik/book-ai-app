# 🤖 Libris CI/CD Automation Pipeline
# Purpose: High-speed automated verification for every push or PR.

name: Libris Engineering Excellence

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ── 🛡️ Database / Migration CI ──────────────────────────────────────────────
  database-ci:
    name: Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Apply Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          echo "Applying CI Stubs..."
          psql -h localhost -U postgres -d postgres -f "backend/ci_stubs.sql"
          for sql in $(ls backend/scripts/*.sql | sort); do
            echo "Applying $sql..."
            psql -h localhost -U postgres -d postgres -f "$sql"
          done

  # ── 🛡️ Backend CI (Python/Flask) ───────────────────────────────────────────
  backend-ci:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    needs: database-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Static Analysis (Ruff)
        run: |
          ruff check backend/
        continue-on-error: false

      - name: Execute Pytest Suite
        run: |
          PYTHONPATH=backend python -m pytest backend/tests/ -v --tb=short

  # ── 🛡️ Docker Build CI ─────────────────────────────────────────────────────
  docker-ci:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Backend Image
        run: |
          docker build --no-cache -t libris-backend backend/

  # ── 🛡️ Frontend CI (Flutter/Dart) ──────────────────────────────────────────
  frontend-ci:
    name: Mobile App Analysis & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Pub Dependencies
        run: |
          cd mobile/flutter_app
          flutter pub get

      - name: Structural Analysis
        run: |
          cd mobile/flutter_app
          flutter analyze --no-fatal-infos

      - name: Unit & Widget Tests
        run: |
          cd mobile/flutter_app
          flutter test
