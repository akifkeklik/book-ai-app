[pytest]
markers =
    unit: Unit tests, isolated from external services.
    api: API tests with Flask test client.
    integration: Tests requiring PostgreSQL/Supabase database connections.
    external: Tests hitting external APIs like Gemini.
    e2e: End-to-end tests requiring full real backend and database infrastructure.
addopts = -m "not integration and not external and not e2e"
filterwarnings =
    ignore:.*custom tp_new.*:DeprecationWarning

