# 🐳 Libris Ecosystem: Unified Orchestration
# Purpose: Single command development and integration testing.
# NOTE: Default credentials (postgrespassword, dev-insecure-api-key, mock Supabase)
# are strictly for local testing and container verification.
# Production deployments require explicitly configured platform environment variables.

services:
  # ── Backend AI Engine (Python/Flask) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libris_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the shell}
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-postgres}}
      - SUPABASE_DB_URL=
      # Local/demo stack only: without Supabase, review/graph/learning repositories are in-memory
      # and lose data on restart. Never set this in a real deployment.
      - ALLOW_IN_MEMORY_REPOSITORIES=${ALLOW_IN_MEMORY_REPOSITORIES:-true}
    env_file:
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health', timeout=3).getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - libris_net

  # ── Web Frontend (Next.js 16) ──────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: libris_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://mock.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-mock_anon_key}
      - LIBRIS_API_KEY=${LIBRIS_API_KEY:-dev-insecure-api-key}
    env_file:
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode < 400 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - libris_net

  # ── Isolated PostgreSQL Test & Rehearsal Service ───────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: libris_postgres_test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - libris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - libris_net

volumes:
  libris_pgdata:

networks:
  libris_net:
    driver: bridge
